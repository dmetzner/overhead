name: Release

# The whole release, on merge. A push to main whose manifest.json version has no
# tag yet is a release: this workflow re-runs the gate, creates the tag and the
# GitHub release (notes lifted from CHANGELOG.md), then calls the three shipping
# workflows directly.
#
# Why it *calls* them instead of just pushing the tag: a tag pushed with
# GITHUB_TOKEN does not trigger `on: push: tags` workflows (GitHub's
# no-recursive-runs rule). Auto-tagging alone would look like it worked and ship
# nothing. Calling them as reusable workflows needs no PAT secret, and they keep
# their own tag triggers so a hand-pushed tag still works exactly as before.
#
# A merge with no bump ends at the `gate` job — see ci.yml's release-readiness
# job, which is what stops a runtime change from landing without one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges landing inside the gate->ci->tag window would both see the version
# untagged and both reach the `tag` job. Serialise instead; never cancel — a
# cancelled run is a half-released version to clean up.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this version released yet?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./manifest.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # "Released" means the tag AND the GitHub release AND both store zips
          # exist — not merely the tag. A half-finished release (tag created,
          # then pack died) must be resumable: every job below is idempotent, so
          # a re-run drives it to completion. Deciding on the tag alone would
          # make the retry a *green no-op* that ships nothing, which is the one
          # outcome this whole workflow exists to prevent.
          release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            zips=$(gh release view "$tag" --json assets \
                     --jq '[.assets[].name | select(endswith(".zip"))] | length' 2>/dev/null || echo 0)
            if [ "${zips:-0}" -ge 2 ]; then
              release=false
            else
              echo "::warning::$tag is tagged but its release carries ${zips:-0} zip(s) — resuming the release"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          if [ "$release" = true ]; then
            echo "::notice::releasing $tag"
            exit 0
          fi

          # Nothing to release. Correct for a docs/CI/test/dependency merge —
          # and wrong for a merge that changed the extension, which then reaches
          # no user. ci.yml's release-readiness job is meant to stop that on the
          # PR, but a check only blocks a merge while it is a *required* status
          # check on main (and `gh pr merge --auto` merges the moment the
          # required ones pass), and with `strict` off a stale base can slip a
          # duplicate bump through anyway. So main says it out loud too.
          runtime=$(awk '!/^[[:space:]]*(#|$)/ {
            gsub(/\./, "\\.");
            print (/\/$/ ? "^" $0 : "^" $0 "$")
          }' .github/runtime-paths.txt | paste -sd '|' -)

          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$runtime"; then
              echo "::error::this push changed shipped runtime files, but $tag is already released — the change reaches no user. Bump manifest.json + package.json, add a CHANGELOG section, and merge that."
              exit 1
            fi
            echo "::notice::$tag is already released and this push changed no runtime file — nothing to do"
          else
            echo "::notice::$tag is already released; no pushed-commit range to check (manual run or force-push)"
          fi

  # Never ship what the suite has not passed, even though the same gate ran on
  # this commit's own push — a release is the one place worth the duplicate.
  ci:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    needs: [gate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Idempotent on purpose. The gate resumes a half-finished release, so this
      # step runs again over a tag and/or release that may already exist — and
      # `git/refs` answers 422 "Reference already exists", which would deadlock
      # the version it half-shipped.
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists — reusing it"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq .ref
          fi
          .github/ensure-release.sh "$TAG" "$V"

  # The zips, the signed Firefox .xpi (which also records the deploy) and the
  # Chrome Web Store push. Each attaches to the release the `tag` job just made.
  pack:
    needs: [gate, tag]
    uses: ./.github/workflows/pack.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    permissions:
      contents: write

  # Secrets are mapped, not inherited: `secrets: inherit` would hand the AMO
  # credentials to the Chrome job and the Chrome credentials to the Firefox one.
  firefox:
    needs: [gate, tag]
    uses: ./.github/workflows/sign-firefox.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    permissions:
      contents: write
      deployments: write

  chrome:
    needs: [gate, tag]
    uses: ./.github/workflows/publish-chrome.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    secrets:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    permissions:
      contents: read
