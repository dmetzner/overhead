name: Release

# The whole release, on merge. A push to main whose manifest.json version is not
# released yet *is* the release: re-run the gate, create the tag and the GitHub
# release (notes from the tagged CHANGELOG section), then call the three
# shipping workflows.
#
# Why it *calls* them instead of just pushing the tag: a tag pushed with
# GITHUB_TOKEN does not trigger `on: push: tags` workflows (GitHub's
# no-recursive-runs rule), so auto-tagging alone would look like it worked and
# ship nothing. Calling them as reusable workflows needs no PAT secret, and they
# keep their own tag triggers so a hand-pushed tag still works.
#
# A merge with no bump stops at `gate`. Whether that is correct is `guard`'s
# question, and whether it should have been stopped on the PR is
# ci.yml's release-readiness job.
#
# The reasoning, and the traps that shaped it: .github/RELEASE.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two merges landing inside the gate->ci->tag window would both see the version
# untagged and both reach the `tag` job. Serialise instead; never cancel — a
# cancelled run is a half-released version to clean up.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Always runs, and deliberately NOT a dependency of the release chain. A push
  # that changed shipped runtime files while this version is already tagged
  # ships nothing — the shippers build the tag's tree, not this push — and that
  # has to go red even while a resume is finishing the tagged version off.
  #
  # It is the `main`-side twin of ci.yml's release-readiness job, which blocks
  # nothing until it is a required status check.
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A runtime change must not land on an already-tagged version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./manifest.json').version")"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is not tagged yet — this push is what gets released"
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::$tag is tagged; no pushed-commit range to check (force-push or a new branch)"
            exit 0
          fi

          runtime=$(awk '!/^[[:space:]]*(#|$)/ {
            gsub(/\./, "\\.");
            print (/\/$/ ? "^" $0 : "^" $0 "$")
          }' .github/runtime-paths.txt | paste -sd '|' -)

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$runtime"; then
            echo "::error::this push changed shipped runtime files, but $tag is already tagged — the shippers build the tag's tree, so the change reaches no user. Bump manifest.json + package.json, add a CHANGELOG section, and merge that."
            exit 1
          fi
          echo "::notice::$tag is already tagged and this push changed no shipped runtime file"

  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this version released yet?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./manifest.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # "Released" means the tag AND the release AND both store zips exist —
          # not merely the tag. A half-finished release (tag created, then pack
          # died) must be resumable: every job below is idempotent and builds the
          # tagged tree, so a re-run drives it to completion. Deciding on the tag
          # alone would make the retry a *green no-op* that ships nothing, which
          # is the one outcome this whole workflow exists to prevent.
          release=true
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if gh release view "$tag" >/dev/null 2>&1; then
              # No `|| echo 0` fallback here: guessing zero when the API call
              # merely failed would resume a *complete* release, and
              # `gh release upload --clobber` deletes an asset before it
              # re-uploads it. Better to go red and be re-run.
              zips=$(gh release view "$tag" --json assets \
                       --jq '[.assets[].name | select(endswith(".zip"))] | length')
            else
              zips=0
            fi
            if [ "$zips" -ge 2 ]; then
              release=false
              echo "::notice::$tag is released with $zips zip(s) — nothing to do"
            else
              echo "::warning::$tag is tagged but its release carries $zips zip(s) — resuming it from $(git rev-parse --short "refs/tags/$tag^{commit}"), not from this push"
            fi
          else
            echo "::notice::releasing $tag from this push"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Never ship what the suite has not passed, even though the same gate ran on
  # this commit's own push — a release is the one place worth the duplicate.
  ci:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    needs: [gate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Idempotent on purpose. The gate resumes a half-finished release, so this
      # step runs again over a tag and/or release that may already exist — and
      # `git/refs` answers 422 "Reference already exists", which would deadlock
      # the version it half-shipped.
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists — reusing it"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --jq .ref
          fi

          # Take the release notes from the TAGGED CHANGELOG, like the shippers
          # take their source from the tagged tree. Identical on a first pass; on
          # a resume this is the difference between the notes for the version
          # being released and the notes of whatever landed since. Read out of
          # the tag rather than checked out, so the *script* stays this commit's.
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          notes="$RUNNER_TEMP/tagged-changelog.md"
          git show "refs/tags/$TAG:CHANGELOG.md" > "$notes" 2>/dev/null || cp CHANGELOG.md "$notes"
          .github/ensure-release.sh "$TAG" "$V" "$notes"

  # The zips, the signed Firefox .xpi (which also records the deploy) and the
  # Chrome Web Store push. Each attaches to the release the `tag` job just made.
  pack:
    needs: [gate, tag]
    uses: ./.github/workflows/pack.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    permissions:
      contents: write

  # Secrets are mapped, not inherited: `secrets: inherit` would hand the AMO
  # credentials to the Chrome job and the Chrome credentials to the Firefox one.
  firefox:
    needs: [gate, tag]
    uses: ./.github/workflows/sign-firefox.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    permissions:
      contents: write
      deployments: write

  chrome:
    needs: [gate, tag]
    uses: ./.github/workflows/publish-chrome.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    secrets:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    permissions:
      contents: read
