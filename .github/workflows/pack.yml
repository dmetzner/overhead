name: Pack extension

# Builds the two store zips and attaches them to the matching GitHub release.
# Runs on a hand-pushed tag, on demand, or called by release.yml on a merge that
# carries a version bump — in the last case `inputs.tag` names the release,
# because a called workflow's `github.ref` is main, not the tag.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify against and attach the zips to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zips to (leave empty to only build artifacts)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      # The TAGGED tree, not the pushed commit. On a first-pass release they are
      # the same; on a resume (release.yml can re-enter a half-finished release
      # from a later push) they are not, and building `github.sha` would attach
      # assets built from the wrong source to that version's release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Empty for a plain workflow_dispatch: build the artifacts, release nothing.
      - name: Resolve the release tag
        id: release
        env:
          IN: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag=""
          if [ -n "$IN" ]; then
            tag="$IN"
          else
            case "$REF" in refs/tags/*) tag="$REF_NAME" ;; esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          V: ${{ steps.manifest.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$V" ]; then
            echo "::error::tag $TAG does not match manifest.json version $V"
            exit 1
          fi

      # Two builds: the committed manifest is Chrome-canonical (background.service_worker).
      # Firefox has no service_worker support (bug 1573659) and uses an event page, so the
      # Firefox build swaps background to the scripts form — each browser loads warning-free.
      - name: Build zips
        env:
          V: ${{ steps.manifest.outputs.version }}
        run: |
          shared="sw.js rules.js share.js standard-headers.js popup.html popup popup.css icons"

          # Chrome — manifest as committed
          zip -r "overhead-chrome-v${V}.zip" manifest.json $shared -x "*.DS_Store"

          # Firefox — inject background.scripts (drop service_worker)
          mkdir -p ff && cp -r $shared ff/
          jq '.background = {"scripts": ["sw.js"], "type": "module"}' manifest.json > ff/manifest.json
          (cd ff && zip -r "../overhead-firefox-v${V}.zip" . -x "*.DS_Store")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: overhead-v${{ steps.manifest.outputs.version }}
          path: overhead-*-v${{ steps.manifest.outputs.version }}.zip

      # `gh` rather than a marketplace action: `--clobber` makes a re-run
      # idempotent, and the shared script gives a hand-pushed tag the same
      # CHANGELOG notes the merge path produces (the action created the release
      # with an empty body).
      - name: Attach to release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          V: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          # The checked-out tree is the tag's, which for a tag predating this
          # script does not carry it — fall back rather than fail the attach.
          if [ -x .github/ensure-release.sh ]; then
            .github/ensure-release.sh "$TAG" "$V"
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            # `|| gh release view` for the same reason ensure-release.sh re-checks:
            # on a tag push both shippers race here and only one can create.
            gh release create "$TAG" --title "$TAG" --generate-notes \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" overhead-chrome-v"$V".zip overhead-firefox-v"$V".zip --clobber
