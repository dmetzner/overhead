name: Sign Firefox add-on

# Signs the add-on as an *unlisted* (self-distributed) Firefox .xpi and attaches
# it to the matching GitHub Release. Unlisted add-ons are signed automatically by
# Mozilla (no human review), so this needs no manual step once the two secrets
# below exist.
#
# One-time setup (repo admin):
#   1. Create an API credential at
#      https://addons.mozilla.org/developers/addon/api/key/
#   2. Add two repository secrets (Settings → Secrets and variables → Actions):
#        AMO_JWT_ISSUER  = the "JWT issuer" (API key, starts with "user:")
#        AMO_JWT_SECRET  = the "JWT secret"
#
# After that a merge to main with a version bump signs and ships by itself
# (release.yml); a hand-pushed tag vX.Y.Z or a manual run still work too.

on:
  push:
    tags: ["v*"]
  # release.yml calls this on a merge that carries a version bump; a called
  # workflow's `github.ref` is main, so the tag has to be passed in.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the signed .xpi to (e.g. v1.1.0)"
        required: true
        type: string
    # Declared, not inherited — the caller passes only these two.
    secrets:
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the signed .xpi to (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  deployments: write   # the "Record the deploy" step at the bottom

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Skip without AMO credentials
        id: gate
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::AMO_JWT_* secrets not configured — skipping Firefox signing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The TAGGED tree, not the pushed commit — see pack.yml.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Read version from manifest
        if: steps.gate.outputs.run == 'true'
        id: manifest
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Same gate as pack.yml: a mismatched tag must not produce a signed XPI.
      - name: Verify tag matches manifest version
        if: steps.gate.outputs.run == 'true'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "${TAG#v}" != "${{ steps.manifest.outputs.version }}" ]; then
            echo "::error::tag $TAG does not match manifest.json version ${{ steps.manifest.outputs.version }}"
            exit 1
          fi

      # And the CI gate: never sign what the suite hasn't passed.
      - name: Lint + tests
        if: steps.gate.outputs.run == 'true'
        run: |
          npx --yes @biomejs/biome@2.5.5 ci .
          node --test

      # web-ext lints and packs from a clean dir, so stage only the runtime files
      # (same set the pack workflow ships) — no README, .git, workflows, examples.
      - name: Stage extension files
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p dist
          cp -r manifest.json sw.js rules.js share.js standard-headers.js popup.html popup popup.css icons dist/
          # Firefox has no service_worker background (bug 1573659) — it uses an
          # event page via background.scripts. The committed manifest is
          # Chrome-canonical (service_worker only, no Chrome warning); swap in
          # the scripts form here so the signed .xpi is warning-free on Firefox.
          jq '.background = {"scripts": ["sw.js"], "type": "module"}' manifest.json > dist/manifest.json

      # AMO rejects a version it already holds ("Version X already exists"). That
      # is not a release failure — it is a re-run of a tag that was already
      # signed — so treat only that conflict as a no-op and skip the upload.
      - name: Sign (unlisted) via AMO
        id: sign
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          out=$(npx --yes web-ext@8 sign \
            --channel=unlisted \
            --source-dir dist \
            --artifacts-dir web-ext-artifacts \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qiE "Version .* already exists"; then
              echo "::notice::AMO already has this version — nothing to sign."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit $code
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Also kept as a workflow artifact. This add-on is self-distributed on
      # Firefox, so the .xpi on the release *is* the Firefox channel — and AMO
      # will not sign a version twice, so if attaching it were the only copy, a
      # failure there would lose it for that version permanently.
      - name: Keep the signed .xpi as an artifact
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overhead-firefox-xpi-v${{ steps.manifest.outputs.version }}
          path: web-ext-artifacts/*.xpi

      - name: Attach signed .xpi to release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('v{0}', steps.manifest.outputs.version) }}
          V: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          # The checked-out tree is the tag's, which for a tag predating this
          # script does not carry it — fall back rather than fail the attach.
          if [ -x .github/ensure-release.sh ]; then
            .github/ensure-release.sh "$TAG" "$V"
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" web-ext-artifacts/*.xpi --clobber

      # AMO answering "version already exists" is a no-op for signing, but it is
      # not a no-op for distribution: if that version's release carries no .xpi,
      # Firefox users have nothing to install and re-running cannot fix it.
      - name: Warn when the release has no .xpi
        if: steps.gate.outputs.run == 'true' && steps.sign.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('v{0}', steps.manifest.outputs.version) }}
        run: |
          set -uo pipefail
          xpis=$(gh release view "$TAG" --json assets \
                   --jq '[.assets[].name | select(endswith(".xpi"))] | length' 2>/dev/null || echo 0)
          if [ "${xpis:-0}" -eq 0 ]; then
            echo "::warning::$TAG has no .xpi and AMO will not re-sign this version — download it from the AMO developer hub, or bump the version to get a fresh signature."
          fi

      # Mission control counts commits since the newest GitHub deployment record in this
      # project's environment (`deploy.environment` in ~/me/setup/mission-control/projects.json).
      # Nothing posts one for a signed AMO upload, and this repo's `github-pages` records are a docs build, so the card would measure whatever unrelated thing last
      # did — this repo's newest record is a `play` release, which is exactly how the WEB build
      # came to be reported 45 days stale while it was current. `~/me/setup/record-deploy.sh`
      # makes the same call from a laptop; deploy.sh calls it there and skips here, where ~/me
      # does not exist.
      #
      # `auto_merge:false` + empty `required_contexts` are load-bearing: with the defaults GitHub
      # refuses to create a deployment while checks are pending or red. This records what already
      # shipped — it is not a gate, and never fails the job.
      - name: Record the deploy
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The checked-out tag's commit, not $GITHUB_SHA: on a resume the two
          # differ, and the record must date the release, not the later push.
          id=$(jq -n --arg ref "$(git rev-parse HEAD)" --arg env "amo" \
                 '{ref:$ref, environment:$env, task:"deploy", auto_merge:false,
                   required_contexts:[], production_environment:true,
                   description:"recorded by the deploy workflow"}' \
               | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id) || true
          case "${id:-}" in ''|null) echo "::warning::deploy not recorded"; exit 0 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success >/dev/null \
            || echo "::warning::deployment $id created without a success status"
