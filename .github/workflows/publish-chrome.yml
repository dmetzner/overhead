name: Publish to Chrome Web Store

# Publishes the Chrome zip to the Web Store for a released version — but only
# once the four CWS_* repo secrets exist. Until then every step is skipped, so it never
# fails a release. See backlog story 34 for the one-time setup Daniel must do:
#   1. CWS developer account ($5) + publish v1 manually to get the item ID.
#   2. Google Cloud → enable Chrome Web Store API → OAuth Desktop client →
#      generate a refresh token.
#   3. Add repo secrets: CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET,
#      CWS_REFRESH_TOKEN.
#
# Talks to the CWS REST API directly with curl: third-party marketplace actions
# are resolved at job setup even when their step is `if`-skipped, so a vanished
# action repo would fail the whole job (this happened with
# mnao305/chrome-webstore-upload-action on v2.4.0).

on:
  push:
    tags: ["v*"]
  # Called by release.yml on a merge that carries a version bump. The tag is an
  # input so a tag push and a merge get the same check; release.yml only calls
  # this on the commit it just tagged.
  workflow_call:
    inputs:
      tag:
        description: "Release tag being published (e.g. v1.1.0)"
        required: true
        type: string
    # Declared, not inherited — the caller passes only these four.
    secrets:
      CWS_EXTENSION_ID:
        required: false
      CWS_CLIENT_ID:
        required: false
      CWS_CLIENT_SECRET:
        required: false
      CWS_REFRESH_TOKEN:
        required: false
  # A tag, not a branch: this checks out `inputs.tag` and refuses a tree whose
  # manifest disagrees with it, so dispatching from a branch could only ever
  # fail. Naming the tag makes a manual re-publish work.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      # The TAGGED tree, not the pushed commit. On a first-pass release they are
      # the same; on a resume (release.yml can re-enter a half-finished release
      # from a later push) they are not, and building `github.sha` would attach
      # assets built from the wrong source to that version's release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        with:
          node-version: "20"

      # The same two gates pack.yml and sign-firefox.yml apply. Without them a
      # bare tag push could publish a mismatched, untested tree to the store —
      # the one irreversible step in the estate.
      - name: Verify tag matches manifest version
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "${TAG#v}" != "$v" ]; then
            echo "::error::tag $TAG does not match manifest.json version $v"
            exit 1
          fi

      - name: Lint + tests
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        run: |
          npx --yes @biomejs/biome@2.5.5 ci .
          node --test

      - name: Build Chrome zip
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        run: |
          zip -r "overhead-chrome.zip" \
            manifest.json sw.js rules.js share.js standard-headers.js popup.html popup popup.css icons \
            -x "*.DS_Store"

      - name: Upload + publish to Chrome Web Store
        if: ${{ env.CWS_EXTENSION_ID != '' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          api=https://www.googleapis.com/chromewebstore/v1.1/items
          v=$(node -p "require('./manifest.json').version")

          token=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -er .access_token)

          # The Web Store is the one shipper that is not idempotent: it refuses a
          # package whose version is not greater than the one it holds. Uploading
          # blindly would make every *resumed* release fail here forever (the
          # release chain can re-enter a half-finished release), so ask first.
          # Tolerate a failed query — an item that has never been published may
          # not answer this, and "unknown" must mean "try the upload", not a red
          # first publish.
          held=$(curl -fsS \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            "$api/$CWS_EXTENSION_ID?projection=DRAFT" | jq -r '.crxVersion // empty') || held=""

          if [ "$held" = "$v" ]; then
            echo "::notice::the Web Store already holds $v — skipping the upload"
            already=true
          else
            already=false
            upload=$(curl -fsS -X PUT \
              -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
              -T overhead-chrome.zip \
              "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
            state=$(echo "$upload" | jq -r .uploadState)
            if [ "$state" != "SUCCESS" ]; then
              echo "::error::upload failed: $upload"
              exit 1
            fi
          fi

          # No -f: the body carries the reason, and a re-publish of a version the
          # store already has (published, or in review) is not a release failure.
          publish=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "$api/$CWS_EXTENSION_ID/publish") || publish='{"error":"request failed"}'

          if echo "$publish" | jq -e '.status | index("OK")' >/dev/null 2>&1; then
            echo "::notice::published $v to the Chrome Web Store"
          elif [ "$already" = true ]; then
            echo "::warning::$v is already uploaded and could not be published again — likely live or in review: $publish"
          else
            echo "::error::publish failed: $publish"
            exit 1
          fi

      - name: Skipped (no CWS secrets)
        if: ${{ env.CWS_EXTENSION_ID == '' }}
        run: echo "CWS_* secrets not configured — skipping Chrome Web Store publish."
