name: CI

# Tags run the same gate as branches — a release must never ship code the
# suite hasn't seen (the sign/pack workflows additionally gate themselves).
# `workflow_call` lets release.yml re-run this exact gate before it ships.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint + format (Biome)
        run: npx --yes @biomejs/biome@2.5.5 ci .
      - name: Syntax check
        run: |
          for f in rules.js share.js sw.js standard-headers.js popup/*.js; do
            node --check "$f"
          done
      - name: Tests
        run: node --test

  # A merge to main releases if and only if it carries a version bump
  # (release.yml tags whatever manifest.json says and ships it). So a pull
  # request that changes a *shipped runtime file* without a bump would land
  # code that never reaches a user — this job is what makes "every merge that
  # changes the extension releases it" true rather than aspirational.
  #
  # Docs, tests, CI and dependency bumps touch no runtime file, so they pass
  # untouched and release nothing.
  release-readiness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bump, CHANGELOG and package.json agree
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head_v=$(node -p "require('./manifest.json').version")
          pkg_v=$(node -p "require('./package.json').version")

          # Unconditional: the two version fields are one number in two files.
          # pack.yml and sign-firefox.yml both read manifest.json, so a stale
          # package.json is only ever a lie about what is released.
          if [ "$head_v" != "$pkg_v" ]; then
            echo "::error file=package.json::package.json version $pkg_v != manifest.json version $head_v"
            exit 1
          fi

          base_v=$(git show "origin/$BASE:manifest.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")

          # The set pack.yml / sign-firefox.yml / publish-chrome.yml actually
          # ship. Keep in step with their ship-lists (see CLAUDE.md).
          runtime='^(manifest\.json|sw\.js|rules\.js|share\.js|standard-headers\.js|popup\.html|popup\.css|popup/|icons/)'

          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          if ! grep -qE "$runtime" <<< "$changed"; then
            echo "::notice::no shipped runtime file changed — no version bump required (this merge releases nothing)"
            exit 0
          fi

          if [ "$head_v" = "$base_v" ]; then
            echo "::error file=manifest.json::shipped runtime files changed but the version is still $head_v — bump manifest.json + package.json and add a '## $head_v'-style CHANGELOG section, or the merge ships nothing"
            exit 1
          fi

          node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a.findIndex((n, i) => n !== b[i]);
            if (cmp === -1 || a[cmp] < b[cmp]) {
              console.log(`::error file=manifest.json::version ${process.argv[1]} does not go forward from ${process.argv[2]}`);
              process.exit(1);
            }
          ' "$head_v" "$base_v"

          if ! grep -qE "^## +${head_v//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## $head_v' section — release.yml uses it as the GitHub release notes"
            exit 1
          fi

          echo "::notice::$base_v -> $head_v, CHANGELOG section present — this merge will release v$head_v"
